components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: "custom-signed-token"
      description: |
        Short-lived (default 15 min) signed access token returned by
        `/auth/login` or `/auth/refresh`. Sent as `Authorization: Bearer {token}`.
        Enforced by the `auth.token` middleware.

  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
      description: Page number (15 records per page).
    RoleId:
      name: role
      in: path
      required: true
      schema: { type: integer }
      description: Role ID
    BrandId:
      name: brand
      in: path
      required: true
      schema: { type: integer }
      description: Brand ID
    VehicleModelId:
      name: vehicleModel
      in: path
      required: true
      schema: { type: integer }
      description: Vehicle model ID
    GenerationId:
      name: generation
      in: path
      required: true
      schema: { type: integer }
      description: Generation ID
    EngineId:
      name: engine
      in: path
      required: true
      schema: { type: integer }
      description: Engine ID
    FuelTypeId:
      name: fuelType
      in: path
      required: true
      schema: { type: integer }
      description: Fuel type ID
    TransmissionId:
      name: transmission
      in: path
      required: true
      schema: { type: integer }
      description: Transmission ID
    DriveTypeId:
      name: driveType
      in: path
      required: true
      schema: { type: integer }
      description: Drive type ID
    BodyTypeId:
      name: bodyType
      in: path
      required: true
      schema: { type: integer }
      description: Body type ID
    VehicleTypeId:
      name: vehicleType
      in: path
      required: true
      schema: { type: integer }
      description: Vehicle type ID
    VehicleId:
      name: vehicle
      in: path
      required: true
      schema: { type: integer }
      description: Vehicle ID
    VehicleImageId:
      name: vehicleImage
      in: path
      required: true
      schema: { type: integer }
      description: Vehicle image ID
    VehicleDocumentId:
      name: vehicleDocument
      in: path
      required: true
      schema: { type: integer }
      description: Vehicle document ID
    VehicleOwnerId:
      name: vehicleOwner
      in: path
      required: true
      schema: { type: integer }
      description: Vehicle owner/driver assignment ID
    ObdDeviceId:
      name: obdDevice
      in: path
      required: true
      schema: { type: integer }
      description: OBD device ID
    ObdSessionId:
      name: obdSession
      in: path
      required: true
      schema: { type: integer }
      description: OBD session ID
    PairingId:
      name: pairing
      in: path
      required: true
      schema: { type: integer }
      description: Vehicle/OBD device pairing ID (`vehicle_obd_devices.id`)

  responses:
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: Missing, invalid, or expired access token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'

  schemas:
    PaginationMeta:
      type: object
      properties:
        type: { type: string, enum: [length_aware, cursor] }
        current_page: { type: integer }
        last_page: { type: integer }
        per_page: { type: integer }
        total: { type: integer }
        from: { type: integer, nullable: true }
        to: { type: integer, nullable: true }
        path: { type: string }

    SuccessEnvelope:
      type: object
      properties:
        success: { type: boolean, example: true }
        message: { type: string, nullable: true }
        data: {}
        meta:
          type: object
          properties:
            timestamp: { type: string, format: date-time }
            timezone: { type: string }
            pagination:
              $ref: '#/components/schemas/PaginationMeta'

    ErrorEnvelope:
      type: object
      properties:
        success: { type: boolean, example: false }
        error:
          type: object
          properties:
            type: { type: string, example: "https://api.horusdrive.com/problems/validation" }
            title: { type: string }
            status: { type: integer, example: 422 }
            detail: { type: string }
            instance: { type: string }
            errors:
              type: object
              additionalProperties:
                type: array
                items: { type: string }
        meta:
          type: object
          properties:
            timestamp: { type: string, format: date-time }
            timezone: { type: string }

    User:
      type: object
      properties:
        id: { type: integer }
        uuid: { type: string, format: uuid }
        first_name: { type: string }
        last_name: { type: string }
        display_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        mobile: { type: string }
        is_active: { type: boolean }
        is_verified: { type: boolean }
        email_verified_at: { type: string, format: date-time, nullable: true }
        mobile_verified_at: { type: string, format: date-time, nullable: true }
        last_login_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    AuthTokenPayload:
      type: object
      properties:
        user: { $ref: '#/components/schemas/User' }
        access_token: { type: string }
        refresh_token: { type: string, format: uuid }
        token_type: { type: string, example: Bearer }
        expires_at: { type: string, format: date-time, nullable: true }

    Role:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    RoleOption:
      type: object
      properties:
        label: { type: string }
        value: { type: integer }

    Permission:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        group: { type: string }
        description: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    PermissionOption:
      type: object
      properties:
        label: { type: string }
        value: { type: integer }
        code: { type: string }

    RegisterRequest:
      type: object
      required: [first_name, last_name, mobile, password, password_confirmation]
      properties:
        first_name: { type: string, maxLength: 100 }
        last_name: { type: string, maxLength: 100 }
        display_name: { type: string, maxLength: 200, nullable: true }
        mobile: { type: string, maxLength: 30, description: "Must be unique" }
        email: { type: string, format: email, maxLength: 255, nullable: true, description: "Must be unique if provided" }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string, minLength: 8 }

    LoginRequest:
      type: object
      required: [login, password]
      properties:
        login: { type: string, maxLength: 255, description: "Email or mobile number" }
        password: { type: string, minLength: 8 }
        device_uuid: { type: string, format: uuid, nullable: true }
        platform: { type: string, maxLength: 50, nullable: true, example: "Android" }
        device_name: { type: string, maxLength: 100, nullable: true }
        os_version: { type: string, maxLength: 50, nullable: true }
        app_version: { type: string, maxLength: 50, nullable: true }
        browser: { type: string, maxLength: 100, nullable: true }
        country: { type: string, minLength: 2, maxLength: 2, nullable: true, example: "AE" }

    VerifyOtpRequest:
      type: object
      required: [mobile, code, purpose]
      properties:
        mobile: { type: string, maxLength: 30 }
        code: { type: string, maxLength: 10 }
        purpose: { type: string, enum: [register, login, forgot_password] }

    ResendOtpRequest:
      type: object
      required: [mobile, purpose]
      properties:
        mobile: { type: string, maxLength: 30 }
        purpose: { type: string, enum: [register, login, forgot_password] }

    RefreshRequest:
      type: object
      required: [refresh_token]
      properties:
        refresh_token: { type: string, format: uuid }

    LogoutRequest:
      type: object
      properties:
        refresh_token: { type: string, format: uuid, nullable: true }

    ForgotPasswordRequest:
      type: object
      required: [mobile]
      properties:
        mobile: { type: string, maxLength: 30 }

    ResetPasswordRequest:
      type: object
      required: [mobile, code, password, password_confirmation]
      properties:
        mobile: { type: string, maxLength: 30 }
        code: { type: string, maxLength: 10 }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string, minLength: 8 }

    ChangePasswordRequest:
      type: object
      required: [current_password, password, password_confirmation]
      properties:
        current_password: { type: string, minLength: 8 }
        password: { type: string, minLength: 8 }
        password_confirmation: { type: string, minLength: 8 }

    StoreRoleRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 100, description: "Must be unique" }
        slug: { type: string, maxLength: 100, description: "Must be unique" }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        is_active: { type: boolean }

    UpdateRoleRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 100, description: "Must be unique (ignoring current role)" }
        slug: { type: string, maxLength: 100, description: "Must be unique (ignoring current role)" }
        description: { type: string, nullable: true }
        is_system: { type: boolean }
        is_active: { type: boolean }

    UpdateRoleStatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }

    SyncRolePermissionsRequest:
      type: object
      required: [permissions]
      properties:
        permissions:
          type: array
          items: { type: integer }
          description: Array of permission IDs (each must exist in `permissions.id`).

    StorePermissionRequest:
      type: object
      required: [name, code, group]
      properties:
        name: { type: string, maxLength: 150 }
        code: { type: string, maxLength: 150, description: "Must be unique" }
        group: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }

    UpdatePermissionRequest:
      type: object
      required: [name, code, group]
      properties:
        name: { type: string, maxLength: 150 }
        code: { type: string, maxLength: 150, description: "Must be unique (ignoring current permission)" }
        group: { type: string, maxLength: 100 }
        description: { type: string, nullable: true }

    # -------------------------------------------------------------------------
    # Shared / generic
    # -------------------------------------------------------------------------
    LabelValueOption:
      type: object
      properties:
        label: { type: string }
        value: { type: integer }

    UpdateActiveStatusRequest:
      type: object
      required: [is_active]
      properties:
        is_active: { type: boolean }

    CatalogLookup:
      type: object
      description: Shared shape for read-only lookup catalogs (fuel types, transmissions, drive types, body types, vehicle types).
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    # -------------------------------------------------------------------------
    # Vehicle module - Catalog: Brands
    # -------------------------------------------------------------------------
    Brand:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }
        logo: { type: string, nullable: true }
        country_id: { type: integer, nullable: true }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StoreBrandRequest:
      type: object
      required: [name, slug]
      properties:
        name: { type: string, maxLength: 100 }
        slug: { type: string, maxLength: 120, description: "Must be unique" }
        logo: { type: string, maxLength: 255, nullable: true }
        country_id: { type: integer, nullable: true, description: "Must exist in countries.id" }
        is_active: { type: boolean }

    # -------------------------------------------------------------------------
    # Vehicle module - Catalog: Models
    # -------------------------------------------------------------------------
    VehicleModel:
      type: object
      properties:
        id: { type: integer }
        brand_id: { type: integer }
        name: { type: string }
        slug: { type: string }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StoreVehicleModelRequest:
      type: object
      required: [brand_id, name, slug]
      properties:
        brand_id: { type: integer, description: "Must exist in brands.id" }
        name: { type: string, maxLength: 120 }
        slug: { type: string, maxLength: 140, description: "Must be unique" }
        is_active: { type: boolean }

    # -------------------------------------------------------------------------
    # Vehicle module - Catalog: Generations
    # -------------------------------------------------------------------------
    Generation:
      type: object
      properties:
        id: { type: integer }
        model_id: { type: integer }
        name: { type: string }
        start_year: { type: integer, nullable: true }
        end_year: { type: integer, nullable: true }
        is_active: { type: boolean }

    StoreGenerationRequest:
      type: object
      required: [model_id, name]
      properties:
        model_id: { type: integer, description: "Must exist in models.id" }
        name: { type: string, maxLength: 120 }
        start_year: { type: integer, minimum: 1900, maximum: 2100, nullable: true }
        end_year: { type: integer, minimum: 1900, maximum: 2100, nullable: true, description: "Must be >= start_year" }
        is_active: { type: boolean }

    # -------------------------------------------------------------------------
    # Vehicle module - Catalog: Engines
    # -------------------------------------------------------------------------
    Engine:
      type: object
      properties:
        id: { type: integer }
        generation_id: { type: integer }
        code: { type: string }
        name: { type: string }
        displacement: { type: number, format: float, nullable: true }
        horse_power: { type: integer, nullable: true }
        torque: { type: integer, nullable: true }
        fuel_type_id: { type: integer }
        transmission_id: { type: integer }
        is_active: { type: boolean }

    EngineOption:
      type: object
      properties:
        label: { type: string }
        value: { type: integer }
        code: { type: string }

    StoreEngineRequest:
      type: object
      required: [generation_id, code, name, fuel_type_id, transmission_id]
      properties:
        generation_id: { type: integer, description: "Must exist in generations.id" }
        code: { type: string, maxLength: 50 }
        name: { type: string, maxLength: 120 }
        displacement: { type: number, format: float, minimum: 0.1, maximum: 9.9, nullable: true }
        horse_power: { type: integer, minimum: 1, maximum: 2000, nullable: true }
        torque: { type: integer, minimum: 1, maximum: 5000, nullable: true }
        fuel_type_id: { type: integer, description: "Must exist in fuel_types.id" }
        transmission_id: { type: integer, description: "Must exist in transmissions.id" }
        is_active: { type: boolean }

    # -------------------------------------------------------------------------
    # Vehicle module - Vehicles
    # -------------------------------------------------------------------------
    VehicleLookupRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        slug: { type: string }

    VehicleEngineRef:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        code: { type: string }
        horse_power: { type: integer, nullable: true }

    Vehicle:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        vin: { type: string, nullable: true }
        plate_number: { type: string, nullable: true }
        manufacture_year: { type: integer }
        current_mileage: { type: integer }
        color: { type: string, nullable: true }
        is_primary: { type: boolean }
        brand: { $ref: '#/components/schemas/VehicleLookupRef' }
        model: { $ref: '#/components/schemas/VehicleLookupRef' }
        generation: { $ref: '#/components/schemas/VehicleLookupRef' }
        engine: { $ref: '#/components/schemas/VehicleEngineRef' }
        body_type: { $ref: '#/components/schemas/VehicleLookupRef' }
        drive_type: { $ref: '#/components/schemas/VehicleLookupRef' }
        vehicle_type: { $ref: '#/components/schemas/VehicleLookupRef' }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleDetails:
      type: object
      description: Returned by the `show` endpoint, with fully-expanded nested catalog resources.
      properties:
        id: { type: integer }
        user_id: { type: integer }
        brand: { $ref: '#/components/schemas/Brand' }
        model: { $ref: '#/components/schemas/VehicleModel' }
        generation: { $ref: '#/components/schemas/Generation' }
        engine: { $ref: '#/components/schemas/Engine' }
        body_type: { $ref: '#/components/schemas/CatalogLookup' }
        drive_type: { $ref: '#/components/schemas/CatalogLookup' }
        vehicle_type: { $ref: '#/components/schemas/CatalogLookup' }
        vin: { type: string, nullable: true }
        plate_number: { type: string, nullable: true }
        manufacture_year: { type: integer }
        current_mileage: { type: integer }
        color: { type: string, nullable: true }
        is_primary: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        deleted_at: { type: string, format: date-time, nullable: true }

    VehicleOption:
      type: object
      properties:
        id: { type: integer }
        name: { type: string, description: "Formatted as \"Brand Model (plate_number or vin)\"" }

    StoreVehicleRequest:
      type: object
      required: [user_id, brand_id, model_id, body_type_id, drive_type_id, vehicle_type_id, manufacture_year, current_mileage]
      properties:
        user_id: { type: integer, description: "Must exist in users.id" }
        brand_id: { type: integer, description: "Must exist in brands.id" }
        model_id: { type: integer, description: "Must exist in models.id" }
        generation_id: { type: integer, nullable: true, description: "Must exist in generations.id" }
        engine_id: { type: integer, nullable: true, description: "Must exist in engines.id" }
        body_type_id: { type: integer, description: "Must exist in body_types.id" }
        drive_type_id: { type: integer, description: "Must exist in drive_types.id" }
        vehicle_type_id: { type: integer, description: "Must exist in vehicle_types.id" }
        vin: { type: string, minLength: 17, maxLength: 17, nullable: true, description: "Must be unique" }
        plate_number: { type: string, maxLength: 30, nullable: true }
        manufacture_year: { type: integer, minimum: 1950, description: "Max is current year + 1" }
        current_mileage: { type: integer, minimum: 0 }
        color: { type: string, maxLength: 50, nullable: true }
        is_primary: { type: boolean }

    # -------------------------------------------------------------------------
    # Vehicle module - Vehicle Images
    # -------------------------------------------------------------------------
    VehicleImage:
      type: object
      properties:
        id: { type: integer }
        url: { type: string }
        is_primary: { type: boolean }
        sort_order: { type: integer }

    VehicleImageDetails:
      type: object
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        disk: { type: string }
        path: { type: string }
        url: { type: string }
        thumbnail_path: { type: string, nullable: true }
        thumbnail_url: { type: string, nullable: true }
        original_name: { type: string }
        mime_type: { type: string }
        size: { type: integer, description: "Bytes" }
        sort_order: { type: integer }
        is_primary: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StoreVehicleImageRequest:
      type: object
      required: [image]
      properties:
        image: { type: string, format: binary, description: "jpg, jpeg, png, or webp; max 5120KB" }
        is_primary: { type: boolean }
        sort_order: { type: integer, minimum: 0 }

    UpdateVehicleImageRequest:
      type: object
      properties:
        is_primary: { type: boolean }
        sort_order: { type: integer, minimum: 0 }

    # -------------------------------------------------------------------------
    # Vehicle module - Vehicle Documents
    # -------------------------------------------------------------------------
    VehicleDocument:
      type: object
      properties:
        id: { type: integer }
        document_type_id: { type: integer }
        document_number: { type: string, nullable: true }
        issue_date: { type: string, format: date, nullable: true }
        expiry_date: { type: string, format: date, nullable: true }
        file:
          type: object
          properties:
            name: { type: string }
            mime_type: { type: string }
            size: { type: integer }
            disk: { type: string }
            path: { type: string }
            url: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    VehicleDocumentDetails:
      type: object
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        document_type:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            slug: { type: string }
        document_number: { type: string, nullable: true }
        issue_date: { type: string, format: date, nullable: true }
        expiry_date: { type: string, format: date, nullable: true }
        is_expired: { type: boolean }
        file:
          type: object
          properties:
            disk: { type: string }
            path: { type: string }
            file_name: { type: string }
            original_name: { type: string }
            mime_type: { type: string }
            size: { type: integer }
            url: { type: string, nullable: true }
        metadata: { type: object, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StoreVehicleDocumentRequest:
      type: object
      required: [document_type_id, file]
      properties:
        document_type_id: { type: integer, description: "Must exist in vehicle_document_types.id (active only)" }
        file: { type: string, format: binary, description: "pdf, jpg, jpeg, png, webp, or heic; max 20480KB" }
        document_number: { type: string, maxLength: 255, nullable: true, description: "Required if the document type has requires_number set" }
        issue_date: { type: string, format: date, nullable: true }
        expiry_date: { type: string, format: date, nullable: true, description: "Must be >= issue_date. Required if the document type has requires_expiry set" }

    UpdateVehicleDocumentRequest:
      type: object
      properties:
        document_type_id: { type: integer, description: "Must exist in vehicle_document_types.id (active only)" }
        document_number: { type: string, maxLength: 255, nullable: true }
        issue_date: { type: string, format: date, nullable: true }
        expiry_date: { type: string, format: date, nullable: true, description: "Must be >= issue_date" }

    # -------------------------------------------------------------------------
    # Vehicle module - Vehicle Owners
    # -------------------------------------------------------------------------
    VehicleOwner:
      type: object
      properties:
        id: { type: integer }
        user_id: { type: integer }
        ownership_type:
          type: string
          enum: [owner, primary_driver, secondary_driver, company, lease, finance, fleet_manager]
        is_primary: { type: boolean }
        ownership_percentage: { type: number, format: float, nullable: true }
        started_at: { type: string, format: date, nullable: true }
        ended_at: { type: string, format: date, nullable: true }
        created_at: { type: string, format: date-time }

    VehicleOwnerDetails:
      type: object
      properties:
        id: { type: integer }
        vehicle_id: { type: integer }
        user_id: { type: integer }
        ownership_type:
          type: string
          enum: [owner, primary_driver, secondary_driver, company, lease, finance, fleet_manager]
        is_primary: { type: boolean }
        ownership_percentage: { type: number, format: float, nullable: true }
        started_at: { type: string, format: date, nullable: true }
        ended_at: { type: string, format: date, nullable: true }
        notes: { type: string, nullable: true }
        vehicle:
          type: object
          properties:
            id: { type: integer }
            plate_number: { type: string, nullable: true }
        user:
          type: object
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    StoreVehicleOwnerRequest:
      type: object
      required: [user_id, ownership_type]
      properties:
        user_id: { type: integer, description: "Must exist in users.id" }
        ownership_type:
          type: string
          enum: [owner, primary_driver, secondary_driver, company, lease, finance, fleet_manager]
        is_primary: { type: boolean }
        ownership_percentage: { type: number, format: float, minimum: 0, maximum: 100, nullable: true }
        started_at: { type: string, format: date, nullable: true }
        ended_at: { type: string, format: date, nullable: true, description: "Must be >= started_at" }
        notes: { type: string, maxLength: 1000, nullable: true }

    UpdateVehicleOwnerRequest:
      type: object
      properties:
        user_id: { type: integer, description: "Must exist in users.id" }
        ownership_type:
          type: string
          enum: [owner, primary_driver, secondary_driver, company, lease, finance, fleet_manager]
        is_primary: { type: boolean }
        ownership_percentage: { type: number, format: float, minimum: 0, maximum: 100, nullable: true }
        started_at: { type: string, format: date, nullable: true }
        ended_at: { type: string, format: date, nullable: true, description: "Must be >= started_at" }
        notes: { type: string, maxLength: 1000, nullable: true }

    # -------------------------------------------------------------------------
    # OBD module - Devices
    # -------------------------------------------------------------------------
    ObdDevice:
      type: object
      properties:
        id: { type: integer }
        serial_number: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        connection_type: { type: string, enum: [bluetooth, wifi, gsm, usb] }
        status: { type: string, enum: [active, inactive, retired] }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ObdDeviceDetails:
      type: object
      properties:
        id: { type: integer }
        serial_number: { type: string }
        manufacturer: { type: string }
        model: { type: string }
        firmware_version: { type: string, nullable: true }
        hardware_version: { type: string, nullable: true }
        connection_type: { type: string, enum: [bluetooth, wifi, gsm, usb] }
        status: { type: string, enum: [active, inactive, retired] }
        mac_address: { type: string, nullable: true }
        imei: { type: string, nullable: true }
        sim_number: { type: string, nullable: true }
        metadata: { type: object, nullable: true }
        last_seen_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
