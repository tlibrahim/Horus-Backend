openapi: 3.0.3
info:
  title: Horus Backend API
  version: "1.0.0"
  description: |
    OpenAPI documentation for the Horus Laravel backend.

    This spec documents the **Auth**, **Vehicle**, and **OBD** modules.
    Remaining modules (Core, Booking, Workshop, Billing, Maintenance, AI, ...)
    are not yet covered. To extend coverage:

    1. Add new `tags` entries below for the module.
    2. Add its `paths` following the same request/response envelope shapes
       already defined in `components.schemas` (`SuccessEnvelope`,
       `ErrorEnvelope`, `PaginationMeta`).
    3. Reuse `components.securitySchemes.bearerAuth` for any route protected
       by the `auth.token` middleware.

    ## Response envelope
    All endpoints return a consistent JSON envelope:
    - Success: `{ "success": true, "message": ..., "data": ..., "meta": {...} }`
    - Error (RFC 7807 problem details): `{ "success": false, "error": { "type", "title", "status", "detail", "instance", "errors" }, "meta": {...} }`

    ## Authentication
    Protected endpoints require `Authorization: Bearer {access_token}`.
    The access token is a short-lived (15 min default) signed token returned
    by `/auth/login`, `/auth/refresh`, or after OTP verification. Use the
    "Authorize" button in Swagger UI to set it once for all requests.

    ## Pagination & filtering
    List (`index`) endpoints support:
    - `page` (integer, default 1) — page number, 15 records per page.
    - `filter[field]=value` — per-resource filters (see each endpoint).

servers:
  - url: /api/v1
    description: Default API base path (adjust host as needed)

tags:
  - name: Auth
    description: Registration, OTP verification, login, tokens, and password management (`Modules/Auth`).
  - name: Roles
    description: |
      Role CRUD and permission assignment (`Modules/Auth`).
      ⚠️ Currently **not** protected by the `auth.token` middleware (known gap, see repo security notes) —
      documented here to reflect actual current behavior.
  - name: Permissions
    description: |
      Permission CRUD (`Modules/Auth`).
      ⚠️ Currently **not** protected by the `auth.token` middleware (same gap as Roles).
  - name: Vehicle Brands
    description: |
      Vehicle brand catalog CRUD (`Modules/Vehicle`).
      ⚠️ Currently **not** protected by the `auth.token` middleware.
  - name: Vehicle Models
    description: Vehicle model catalog CRUD, scoped to a brand (`Modules/Vehicle`).
  - name: Vehicle Generations
    description: Vehicle generation catalog CRUD, scoped to a model (`Modules/Vehicle`).
  - name: Vehicle Engines
    description: Engine catalog CRUD, scoped to a generation (`Modules/Vehicle`).
  - name: Fuel Types
    description: Read-only fuel type lookup catalog (`Modules/Vehicle`).
  - name: Transmissions
    description: Read-only transmission lookup catalog (`Modules/Vehicle`).
  - name: Drive Types
    description: Read-only drive type lookup catalog (`Modules/Vehicle`).
  - name: Body Types
    description: Read-only body type lookup catalog (`Modules/Vehicle`).
  - name: Vehicle Types
    description: Read-only vehicle type lookup catalog (`Modules/Vehicle`).
  - name: Vehicles
    description: Vehicle CRUD (`Modules/Vehicle`).
  - name: Vehicle Images
    description: Vehicle photo upload/management (`Modules/Vehicle`).
  - name: Vehicle Documents
    description: Vehicle document (registration, insurance, ...) upload/management (`Modules/Vehicle`).
  - name: Vehicle Owners
    description: Vehicle ownership/driver assignment records (`Modules/Vehicle`).
  - name: OBD Devices
    description: OBD-II hardware device inventory CRUD (`Modules/OBD`).
  - name: Vehicle OBD Pairing
    description: Pairing/unpairing OBD devices to vehicles and pairing history (`Modules/OBD`).
  - name: OBD Sessions
    description: OBD telemetry session lifecycle - create, connect, heartbeat, disconnect (`Modules/OBD`).

security: []

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      description: Creates a user account and sends an OTP (purpose `register`) to the mobile number for verification.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered, OTP sent
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          user:
                            $ref: '#/components/schemas/User'
                          otp_sent:
                            type: boolean
                          expires_at:
                            type: string
                            format: date-time
                            nullable: true
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/verify-otp:
    post:
      tags: [Auth]
      summary: Verify an OTP code
      description: Verifies an OTP for `register`, `login`, or `forgot_password` purposes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyOtpRequest'
      responses:
        '200':
          description: OTP verification result
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          verified:
                            type: boolean
                          purpose:
                            type: string
                            enum: [register, login, forgot_password]
                          mobile:
                            type: string
                          user:
                            allOf:
                              - $ref: '#/components/schemas/User'
                            nullable: true
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/resend-otp:
    post:
      tags: [Auth]
      summary: Resend an OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendOtpRequest'
      responses:
        '200':
          description: OTP resent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Too many OTP requests (throttled)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with mobile/email + password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenPayload'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: New token pair issued
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/AuthTokenPayload'
        '401':
          description: Refresh token invalid, expired, or revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/forgot-password:
    post:
      tags: [Auth]
      summary: Request a password-reset OTP
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '200':
          description: Reset OTP sent (if account exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/reset-password:
    post:
      tags: [Auth]
      summary: Reset password using OTP code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Password reset successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Log out the current session
      security: [{ bearerAuth: [] }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Log out all sessions/devices for the current user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: All sessions logged out
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/change-password:
    post:
      tags: [Auth]
      summary: Change the current user's password
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: Password changed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/roles:
    get:
      tags: [Roles]
      summary: List roles
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: filter[name]
          in: query
          schema: { type: string }
          description: Partial (ILIKE) match on role name.
        - name: filter[is_active]
          in: query
          schema: { type: boolean }
        - name: filter[is_system]
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated list of roles
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Role' }
    post:
      tags: [Roles]
      summary: Create a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreRoleRequest'
      responses:
        '201':
          description: Role created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/roles/options:
    get:
      tags: [Roles]
      summary: List roles as select options
      responses:
        '200':
          description: Role options
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/RoleOption' }

  /auth/roles/{role}:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      tags: [Roles]
      summary: Get a role by ID
      responses:
        '200':
          description: Role details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Roles]
      summary: Update a role
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleRequest'
      responses:
        '200':
          description: Role updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Roles]
      summary: Delete a role
      responses:
        '200':
          description: Role deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/roles/{role}/status:
    patch:
      tags: [Roles]
      summary: Toggle or set a role's active status
      parameters:
        - $ref: '#/components/parameters/RoleId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRoleStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/roles/{role}/activate:
    patch:
      tags: [Roles]
      summary: Activate a role
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Role activated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/roles/{role}/deactivate:
    patch:
      tags: [Roles]
      summary: Deactivate a role
      parameters:
        - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Role deactivated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Role' }
        '404':
          $ref: '#/components/responses/NotFound'

  /auth/roles/{role}/permissions:
    parameters:
      - $ref: '#/components/parameters/RoleId'
    get:
      tags: [Roles]
      summary: List a role's assigned permissions
      responses:
        '200':
          description: Permissions assigned to the role
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Permission' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Roles]
      summary: Sync (replace) a role's assigned permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncRolePermissionsRequest'
      responses:
        '200':
          description: Permissions synced
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          role: { $ref: '#/components/schemas/Role' }
                          permissions:
                            type: array
                            items: { $ref: '#/components/schemas/Permission' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/permissions:
    get:
      tags: [Permissions]
      summary: List permissions
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: filter[name]
          in: query
          schema: { type: string }
        - name: filter[code]
          in: query
          schema: { type: string }
        - name: filter[group]
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Paginated list of permissions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Permission' }
    post:
      tags: [Permissions]
      summary: Create a permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StorePermissionRequest'
      responses:
        '201':
          description: Permission created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Permission' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/permissions/options:
    get:
      tags: [Permissions]
      summary: List permissions as select options
      responses:
        '200':
          description: Permission options
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/PermissionOption' }

  /auth/permissions/{permission}:
    parameters:
      - name: permission
        in: path
        required: true
        schema: { type: integer }
        description: Permission ID
    get:
      tags: [Permissions]
      summary: Get a permission by ID
      responses:
        '200':
          description: Permission details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Permission' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Permissions]
      summary: Update a permission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePermissionRequest'
      responses:
        '200':
          description: Permission updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Permission' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Permissions]
      summary: Delete a permission
      responses:
        '200':
          description: Permission deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessEnvelope'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------------
  # Vehicle module - Catalog: Brands
  # ---------------------------------------------------------------------------
  /vehicle/brands:
    get:
      tags: [Vehicle Brands]
      summary: List vehicle brands
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: filter[name]
          in: query
          schema: { type: string }
          description: Partial match on brand name.
        - name: filter[slug]
          in: query
          schema: { type: string }
        - name: filter[country_id]
          in: query
          schema: { type: integer }
        - name: filter[is_active]
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated list of brands
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/Brand' }
    post:
      tags: [Vehicle Brands]
      summary: Create a vehicle brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBrandRequest'
      responses:
        '201':
          description: Brand created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Brand' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /vehicle/brands/options:
    get:
      tags: [Vehicle Brands]
      summary: List brands as select options
      responses:
        '200':
          description: Brand options
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/LabelValueOption' }

  /vehicle/brands/{brand}:
    parameters:
      - $ref: '#/components/parameters/BrandId'
    get:
      tags: [Vehicle Brands]
      summary: Get a brand by ID
      responses:
        '200':
          description: Brand details
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Brand' }
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Vehicle Brands]
      summary: Update a brand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreBrandRequest'
      responses:
        '200':
          description: Brand updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Brand' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      tags: [Vehicle Brands]
      summary: Delete (soft-delete) a brand
      responses:
        '204':
          description: Brand deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /vehicle/brands/{brand}/status:
    patch:
      tags: [Vehicle Brands]
      summary: Toggle a brand's active status
      parameters:
        - $ref: '#/components/parameters/BrandId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateActiveStatusRequest'
      responses:
        '200':
          description: Status updated
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/Brand' }
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ---------------------------------------------------------------------------
  # Vehicle module - Catalog: Models
  # ---------------------------------------------------------------------------
  /vehicle/models:
    get:
      tags: [Vehicle Models]
      summary: List vehicle models
      parameters:
        - $ref: '#/components/parameters/Page'
        - name: filter[brand_id]
          in: query
          schema: { type: integer }
        - name: filter[name]
          in: query
          schema: { type: string }
        - name: filter[slug]
          in: query
          schema: { type: string }
        - name: filter[is_active]
          in: query
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated list of models
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessEnvelope'
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: '#/components/schemas/VehicleModel' }
    post:
      tags: [Vehicle Models]
      summary: Create a vehicle model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreVehicleModelRequest'
